name: CI/CD EC2 Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ec2-deploy-main-v2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_journal_test
      AUTH_SECRET: ci-only-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: packages/database

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    env:
      DATABASE_URL: postgresql://placeholder/placeholder
      AUTH_SECRET: build-only-placeholder-secret-32chars
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build database package
        run: npm run build --workspace=@repo/database

      - name: Build API package
        run: npm run build --workspace=@repo/api
        continue-on-error: true

      - name: Build Next.js app
        run: npm run build --workspace=trading-journal

      - name: Setup SSH key
        env:
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "$EC2_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to EC2
        env:
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.turbo' \
            --exclude 'coverage' \
            --exclude '*.pem' \
            --exclude '.env' \
            --exclude 'apps/web/.env' \
            -e "ssh -i ~/.ssh/ec2_key -p $EC2_PORT" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/"

      - name: Write API env file to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            {
              echo "AWS_REGION=${{ secrets.AWS_REGION }}"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}"
            } > "${{ secrets.EC2_APP_DIR }}/apps/api/.env"
            sed -i '/^AWS_/d' "${{ secrets.EC2_APP_DIR }}/apps/web/.env" 2>/dev/null || true
            {
              echo "AWS_REGION=${{ secrets.AWS_REGION }}"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}"
            } >> "${{ secrets.EC2_APP_DIR }}/apps/web/.env"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            SKIP_GIT_PULL=true BRANCH=main APP_NAME=tradevault bash scripts/ec2-deploy.sh
